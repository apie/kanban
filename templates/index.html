<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanban</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    .kanban-col { min-height: 60vh; transition: background .15s; }
    .kanban-col.drag-over { background: var(--bs-primary-bg-subtle) !important; }
    .kanban-card { cursor: grab; }
    .kanban-card.dragging { opacity: .5; }
  </style>
</head>
<body class="bg-body-tertiary">
<div class="container-fluid py-4">
  <h1 class="h3 mb-4">Kanban board</h1>

  <form class="row g-2 mb-4"
        hx-post="/cards" hx-target="#board" hx-swap="innerHTML"
        hx-on::after-request="if(event.detail.successful) this.reset()">
    <div class="col-md-4"><input name="title" class="form-control" placeholder="Card title" required></div>
    <div class="col-md-4"><input name="description" class="form-control" placeholder="Description (optional)"></div>
    <div class="col-md-2">
      <select name="status" class="form-select">
        {% for key, label in columns %}<option value="{{ key }}">{{ label }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-2 d-grid"><button class="btn btn-primary">Add card</button></div>
  </form>

  <div id="board">{% include "_board.html" %}</div>
</div>

<script>
  // Drag & drop via event delegation, so it keeps working after htmx swaps.
  document.addEventListener("dragstart", e => {
    const card = e.target.closest(".kanban-card");
    if (!card) return;
    e.dataTransfer.setData("text/plain", card.dataset.id);
    card.classList.add("dragging");
  });
  document.addEventListener("dragend", e => e.target.closest?.(".kanban-card")?.classList.remove("dragging"));
  document.addEventListener("dragover", e => {
    const col = e.target.closest(".kanban-col");
    if (!col) return;
    e.preventDefault();
    col.classList.add("drag-over");
  });
  document.addEventListener("dragleave", e => e.target.closest?.(".kanban-col")?.classList.remove("drag-over"));
  document.addEventListener("drop", e => {
    const col = e.target.closest(".kanban-col");
    if (!col) return;
    e.preventDefault();
    col.classList.remove("drag-over");
    const id = e.dataTransfer.getData("text/plain");
    htmx.ajax("POST", `/cards/${id}/move`, {
      target: "#board", swap: "innerHTML", values: { status: col.dataset.status }
    });
  });
</script>
</body>
</html>

<div class="row g-3">
  {% for key, label in columns %}
  <div class="col-md-4">
    <div class="card h-100">
      <div class="card-header d-flex justify-content-between align-items-center">
        <strong>{{ label }}</strong>
        <span class="badge text-bg-secondary">{{ grouped[key]|length }}</span>
      </div>
      <div class="card-body kanban-col bg-body-secondary" data-status="{{ key }}">
        {% for card in grouped[key] %}
        <div class="card kanban-card mb-2 shadow-sm" draggable="true" data-id="{{ card.id }}">
          <div class="card-body p-2">
            <div class="d-flex justify-content-between align-items-start">
              <h6 class="mb-1">{{ card.title }}</h6>
              <button class="btn-close btn-sm" aria-label="Delete"
                      hx-delete="/cards/{{ card.id }}" hx-target="#board" hx-swap="innerHTML"
                      hx-confirm="Delete this card?"></button>
            </div>
            {% if card.description %}<p class="small text-body-secondary mb-2">{{ card.description }}</p>{% endif %}
            <div class="btn-group btn-group-sm">
              {% for k, l in columns if k != key %}
              <button class="btn btn-outline-secondary"
                      hx-post="/cards/{{ card.id }}/move" hx-vals='{"status": "{{ k }}"}'
                      hx-target="#board" hx-swap="innerHTML">→ {{ l }}</button>
              {% endfor %}
            </div>
          </div>
        </div>
        {% else %}
        <p class="text-body-secondary small text-center my-3">Drop cards here</p>
        {% endfor %}
      </div>
    </div>
  </div>
  {% endfor %}
</div>
